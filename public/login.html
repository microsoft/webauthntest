<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Passkey Playground</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body id="signInPrompt" class="min-h-screen bg-base-200 text-base-content">
    <main class="min-h-screen flex items-center justify-center p-4">
        <div class="login-shell w-full max-w-md">
            <div class="card bg-base-100 shadow-xl border border-base-300">
                <div class="card-body">
                    <h1 class="login-title text-3xl font-bold">Pick a Username</h1>
                    <br>
                    <form onsubmit="return handleSubmit()" class="mt-2 space-y-2">
                        <label class="form-control w-full">
                            <div class="uid-input-wrap">
                                <input class="input input-bordered w-full" type="text" id="uid" autofocus placeholder="Username" autocomplete="username">
                                <button type="button" class="btn btn-ghost btn-sm btn-circle uid-refresh" id="refreshUsername" title="Generate new username" aria-label="Generate new username">
                                    <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                                </button>
                            </div>
                        </label>
                    </form>
                    <br>
                    <div class="card-actions mt-2">
                        <button class="btn btn-primary w-full" id="signInButton" type="button">CONTINUE</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Local storage notice -->
    <div id="cookieConsent" class="cookie-consent" role="note" aria-label="Local storage notice" hidden>
        <div class="cookie-consent-bar">
            <p class="cookie-consent-text">
                This website stores your username and credential details in this browser.
                See the <a href="privacy.html" target="_blank" rel="noopener">Local Storage Notice</a>.
            </p>
            <button type="button" class="cookie-consent-ok" id="cookieAccept">OK</button>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"
    integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
<script src="wordlist.js"></script>
<script>
    var CONSENT_KEY = 'localStorageNotice';

    function consentAcknowledged() {
        try { return localStorage.getItem(CONSENT_KEY) === 'acknowledged'; } catch (e) { return false; }
    }
    function acknowledgeConsent() {
        try { localStorage.setItem(CONSENT_KEY, 'acknowledged'); } catch (e) { /* ignore */ }
    }

    $(window).on('load', function () {
        // Implied-consent banner: shown until the user acknowledges it.
        if (!consentAcknowledged()) {
            var el = document.getElementById('cookieConsent');
            if (el) el.hidden = false;
        }

        $('#signInButton').click(() => {
            handleSubmit();
        });

        // Prefill the username box: prefer a name carried over from sign-out,
        // otherwise auto-fill a random username when the box is empty.
        if (!String($('#uid').val() || '').trim()) {
            var prefill = '';
            try { prefill = localStorage.getItem('prefillUid') || ''; } catch (e) { prefill = ''; }
            if (prefill) {
                try { localStorage.removeItem('prefillUid'); } catch (e) { /* ignore */ }
                $('#uid').val(prefill);
            } else {
                $('#uid').val(generateUsername());
            }
        }
        $('#refreshUsername').click(() => {
            $('#uid').val(generateUsername());
            try { document.getElementById('uid').focus(); } catch (e) { /* ignore */ }
        });

        $('#cookieAccept').click(() => {
            acknowledgeConsent();
            var el = document.getElementById('cookieConsent');
            if (el) el.hidden = true;
        });
    });

    // Generates a readable random username by joining 3 words from the BIP-39
    // 2048-word list in camelCase (e.g. "braveGardenOtter"). This yields
    // 2048^3 (~8.6 billion) combinations. Uses crypto-strong randomness with
    // rejection sampling to avoid modulo bias.
    function generateUsername() {
        const words = (window.WORD_LIST && window.WORD_LIST.length) ? window.WORD_LIST : null;
        if (!words) {
            // Fallback: unambiguous random letters if the word list failed to load.
            const alphabet = 'abcdefghjkmnpqrstuvwxyz';
            const out = [];
            const maxA = 256 - (256 % alphabet.length);
            while (out.length < 12) {
                const b = new Uint8Array(12);
                (window.crypto || window.msCrypto).getRandomValues(b);
                for (let i = 0; i < b.length && out.length < 12; i++) {
                    if (b[i] < maxA) out.push(alphabet[b[i] % alphabet.length]);
                }
            }
            return out.join('');
        }

        const n = words.length; // 2048
        const picked = [];
        while (picked.length < 3) {
            const buf = new Uint8Array(6);
            (window.crypto || window.msCrypto).getRandomValues(buf);
            for (let i = 0; i + 1 < buf.length && picked.length < 3; i += 2) {
                // Combine two bytes into an 11-bit index (0..2047) via rejection.
                const val = (buf[i] << 8) | buf[i + 1];
                const bound = 65536 - (65536 % n);
                if (val < bound) picked.push(words[val % n]);
            }
        }

        return picked
            .map((w, i) => (i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1)))
            .join('');
    }

    function handleSubmit() {
        const raw = String($('#uid').val() || '').trim();
        const uid = raw.toLowerCase();

        if (!uid || uid.length < 3 || uid.includes(" ")) {
            alert("Invalid username");
            return false;
        }

        // Keep the local profile name on this device. uidDisplay preserves the
        // original casing purely for display (for example, camelCase names).
        try {
            localStorage.setItem('uid', uid);
            localStorage.setItem('uidDisplay', raw);
        } catch (e) {
            alert('Local browser storage is unavailable. Enable site storage and try again.');
            return false;
        }
        window.location.href = "./";
        return false;
    }
</script>

</html>
