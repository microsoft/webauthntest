<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <title>WebAuthn Decoder</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:regular,bold,italic,thin,light,bolditalic,black,medium&amp;lang=en">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content cbor-page">
    <div class="min-h-screen flex flex-col">
        <header class="navbar bg-primary text-primary-content px-4">
            <div class="navbar-start">
                <h1 class="text-lg font-semibold"><a href="decode.html" class="title-link">WebAuthn Decoder</a></h1>
            </div>
        </header>

        <div class="credentials-toolbar cbor-nav-toolbar">
            <div class="credentials-toolbar-actions cbor-nav-toolbar-actions" aria-label="Navigation actions">
                <a class="btn btn-ghost btn-sm btn-circle" href="index.html" title="Home" aria-label="Home">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                </a>
                <a class="btn btn-ghost btn-sm btn-circle" href="decode.html" title="WebAuthn Decoder" aria-label="WebAuthn Decoder">
                    <span class="material-symbols-outlined" aria-hidden="true">frame_inspect</span>
                </a>
                <a class="btn btn-ghost btn-sm btn-circle" href="cbor.html" title="CBOR Playground" aria-label="CBOR Playground">
                    <span class="material-symbols-outlined" aria-hidden="true">code</span>
                </a>
                <a class="btn btn-ghost btn-sm btn-circle" href="mds.html" title="Authenticator Metadata" aria-label="Authenticator Metadata">
                    <span class="material-symbols-outlined" aria-hidden="true">badge</span>
                </a>
            </div>
        </div>

        <main class="flex-1 p-4">
            <div class="cbor-container">
                <section class="cbor-section">
                    <div class="card bg-base-100 shadow-xl border border-base-300">
                        <div class="card-body gap-3">
                            <textarea id="decodeInput" class="textarea textarea-bordered w-full cbor-mono" rows="6"
                                placeholder="Paste a PublicKeyCredential JSON, attestation object, authenticator data, or X.509 certificate (hex, base64, base64url, or PEM)."></textarea>
                            <div class="flex items-center flex-wrap gap-2">
                                <button id="decodeBtn" class="btn btn-link btn-sm">Decode</button>
                                <button id="clearBtn" class="btn btn-link btn-sm">Clear</button>
                                <button id="copyInputBtn" class="btn btn-link btn-sm">Copy</button>
                                <label class="btn btn-link btn-sm" for="importDecodeFile">Import File</label>
                                <input type="file" id="importDecodeFile" accept=".json,.cbor,.der,.pem,.crt,.cer,.bin,.txt,application/json,application/cbor,application/octet-stream" style="display:none;" />
                                <span id="decodeError" class="text-xs text-error" style="display:none;"></span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="cbor-section">
                    <div id="decodeResultCard" class="card bg-base-100 shadow-xl border border-base-300" style="display:none;">
                        <div class="card-body gap-2">
                            <div id="decodeResult" class="decode-result"></div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="toast" class="toast toast-center toast-bottom z-50"></div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
        crossorigin="anonymous"></script>
    <script src="cbor.js"></script>
    <script type="module" src="decode.js"></script>
</body>
</html>
